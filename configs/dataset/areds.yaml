# @package _global_
dataset:
  dir: ./datasets
  name: areds
  name_eval: areds
  feature: amd
  image_size: [256, 256]
  sample_size: null
  kfold: 0

model:
  dropout: 0.2

train:
  label_smoothing: 0

stop:
  min_delta: 0.01
  patience: 15
  monitor: loss

optim:
  lr_backbone: 5e-6
  lr_head: 1e-3
  wd: 1e-4
